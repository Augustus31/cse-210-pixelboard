<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Running — Shared Lexicon integration</title>
<style>
body {font: 17px system-ui; max-width: 1000px; margin: 48px auto; color: #202632; padding: 0 24px}
h1 {font-size: 30px} pre {line-height: 1.8; background: #eff8f0; padding: 24px; white-space: pre-wrap}
</style>
<h1>Save/Load — Shared Lexicon integration</h1>
<p>Actual Lexicon helpers + OAuth adapter + native browser PNG conversion.</p>
<p>PDS responses are simulated in memory. No account login or remote writes.</p>
<pre id="results">Running…</pre>
<script type="module">
import { createAuthenticatedPdsStore } from '/src/storage/authenticatedPdsStore.js';
const records = new Map(), blobs = new Map();
const did = 'did:plc:testowner', collection = 'cloud.pixelboard.imageBoard';
let sequence = 0, time = '2026-11-26T12:00:00.000Z';
const json = (data, status = 200) => new Response(JSON.stringify(data), {status});
const auth = {
  initAuth: async () => ({did}), currentDid: () => did,
  authFetch: async (path, init) => {
    const url = new URL(path, location.origin);
    const method = url.pathname.split('.').at(-1);
    const body = typeof init.body === 'string' ? JSON.parse(init.body) : init.body;
    if (method === 'uploadBlob') {
      const cid = `blob-${++sequence}`;
      blobs.set(cid, body);
      return json({blob: {$type:'blob', ref:{$link:cid}, mimeType:'image/png', size:body.size}});
    }
    if (method === 'createRecord' || method === 'putRecord') {
      const id = body.rkey ?? `drawing-${++sequence}`;
      const entry = {uri:`at://${did}/${collection}/${id}`, cid:`cid-${++sequence}`, value:body.record};
      records.set(id, entry);
      return json({uri:entry.uri, cid:entry.cid});
    }
    if (method === 'listRecords') return json({records:[...records.values()]});
    if (method === 'getRecord') return records.has(url.searchParams.get('rkey'))
      ? json(records.get(url.searchParams.get('rkey'))) : json({error:'RecordNotFound'},400);
    if (method === 'getBlob') return new Response(blobs.get(url.searchParams.get('cid')));
    if (method === 'deleteRecord') { records.delete(body.rkey); return json({}); }
    throw new Error(`Unexpected request ${method}`);
  }
};
const lines = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); };
try {
  const store = await createAuthenticatedPdsStore({now: () => new Date(time)}, () => auth);
  for (const size of [25,40,64,512]) {
    const pixels = Array.from({length:size*size}, (_,i) =>
      `#${((i*7919)%16777216).toString(16).padStart(6,'0')}`);
    const saved = await store.saveDraft({size,pixels});
    const restored = await store.loadDraft(saved.id);
    assert(JSON.stringify(restored.pixels) === JSON.stringify(pixels), 'Pixel mismatch');
    assert(restored.uri === saved.uri, 'AT URI mismatch');
    const createdAt = records.get(saved.id).value.createdAt;
    time = '2026-11-26T13:00:00.000Z';
    const updated = await store.updateDraft(saved.id, {size,pixels});
    assert(updated.uri === saved.uri, 'Update changed record identity');
    assert(records.get(saved.id).value.createdAt === createdAt, 'Update changed creation time');
    assert(updated.savedAt === time, 'Updated time was not persisted');
    assert((await store.listDrafts()).length === 1, 'List failed');
    assert(await store.deleteDraft(saved.id), 'Delete failed');
    assert(await store.loadDraft(saved.id) === null, 'Deleted drawing is still present');
    lines.push(`PASS: ${size} × ${size} — exact pixels; save / load / update / list / delete`);
    time = '2026-11-26T12:00:00.000Z';
  }
  lines.push('PASS: stable AT URI for backend handoff; persisted creation/update timestamps');
  document.getElementById('results').textContent = lines.join('\n');
  document.title = 'PASS — Shared Lexicon integration';
} catch (error) {
  document.getElementById('results').textContent = lines.join('\n') + '\nFAIL: ' + error.message;
  document.title = 'FAIL — Shared Lexicon integration';
}
</script>
</html>
