<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Save/Load PNG browser checks</title></head>
  <body>
    <h1>Native browser PNG round trips</h1>
    <pre id="results">Running…</pre>
    <script type="module">
      import { createPngCodec } from '/src/storage/pngCodec.js';
      const result = document.getElementById('results');
      const lines = [];
      try {
        const codec = createPngCodec();
        for (const size of [25, 40, 64]) {
          const pixels = Array.from({ length: size * size }, (_, index) =>
            `#${((index * 7919) % 16777216).toString(16).padStart(6, '0')}`);
          const png = await codec.encode({ size, pixels });
          const decoded = await codec.decode(png, { width: size, height: size });
          if (decoded.size !== size || JSON.stringify(decoded.pixels) !== JSON.stringify(pixels)) {
            throw new Error(`Pixel mismatch at ${size} × ${size}`);
          }
          lines.push(`PASS: ${size} × ${size}; ${png.size} PNG bytes; every pixel matches.`);
        }
        result.textContent = lines.join('\n');
        document.title = 'PASS — Save/Load PNG browser checks';
      } catch (error) {
        result.textContent = `${lines.join('\n')}\nFAIL: ${error.message}`;
        document.title = 'FAIL — Save/Load PNG browser checks';
      }
    </script>
  </body>
</html>
