<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Pixel drawing editor with three canvas sizes, drawing tools, colors, and local drafts." />
    <title>Pixelboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header"><a class="brand" href="./">Pixelboard</a></header>
    <main>
      <div class="workspace">
        <section class="drawing-panel" aria-label="Drawing workspace">
          <section class="editor-actions"><label class="size-control" for="canvas-size">Canvas size<select id="canvas-size"><option value="64">64 × 64</option><option value="40">40 × 40</option><option value="25">25 × 25</option></select></label><div class="history-buttons"><button id="undo" disabled><svg class="control-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5 3 9l4 4M3 9h9a5 5 0 0 1 0 10"/></svg> Undo</button><button id="redo" disabled><svg class="control-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 5 4 4-4 4M17 9H8a5 5 0 0 0 0 10"/></svg> Redo</button></div><button id="download" class="primary"><svg class="control-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v11m-4-4 4 4 4-4M3 14v4h14v-4"/></svg><span>Download PNG</span></button></section>
          <div class="canvas-toolbar"><div class="tools" role="group" aria-label="Drawing tools"><button id="pencil" class="active" aria-pressed="true" aria-expanded="false" aria-controls="brush-panel" title="Pencil (P)"><svg class="control-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 13-1 5 5-1L18 7l-4-4Z"/><path d="m12 5 4 4"/></svg><span>Pencil</span></button><button id="eraser" aria-pressed="false" aria-expanded="false" aria-controls="brush-panel" title="Eraser (E)"><svg class="control-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 11 8-8a2 2 0 0 1 3 0l3 3a2 2 0 0 1 0 3l-8 8H7l-4-4a2 2 0 0 1 1-2Z"/><path d="m8 7 7 7M10 17h8"/></svg><span>Eraser</span></button><button id="clear" title="Erase every pixel on the current canvas (undoable)">Erase all</button><button id="eyedropper" aria-pressed="false" title="Eyedropper (I): click a cell to use its color"><svg class="control-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4 5 5M11 6l-7 7-1 5 5-1 7-7M14 3l3 3"/></svg><span>Eyedropper</span></button></div><label class="grid-toggle"><input id="grid" type="checkbox" checked /> Show grid</label>
            <div id="brush-panel" class="brush-panel" role="group" aria-label="Brush settings" hidden>
              <label class="brush-label" for="brush-size-range">Size</label>
              <div class="brush-size-row"><input type="range" id="brush-size-range" min="1" max="16" step="1" value="1" aria-label="Brush size" /><input type="number" id="brush-size-number" min="1" max="16" step="1" value="1" aria-label="Brush size number" /><span id="brush-size-max">/ 16</span></div>
              <div class="brush-shape" role="group" aria-label="Brush shape"><button type="button" data-shape="square" aria-pressed="true">■ Square</button><button type="button" data-shape="round" aria-pressed="false">● Round</button></div>
            </div>
          </div>
          <div class="canvas-stage"><div class="canvas-wrap"><canvas id="drawing" width="64" height="64" tabindex="0" aria-label="64 by 64 drawing canvas. Drag to draw, or use arrow keys to move and Space to paint."></canvas><div id="grid-overlay" aria-hidden="true"></div><div id="cursor" hidden aria-hidden="true"></div><div id="brush-outline" hidden aria-hidden="true"><svg viewBox="0 0 64 64" preserveAspectRatio="none"><path class="outline-light" /><path class="outline-dark" /></svg></div></div></div>
          <div class="canvas-footer"><span id="position">64 × 64 pixels</span><div class="zoom-controls"><button id="zoom-out" title="Zoom out">−</button><span id="zoom-value">100%</span><button id="zoom-in" title="Zoom in">+</button><button id="zoom-reset" title="Reset zoom"><svg class="control-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a7 7 0 1 1 0 5M3 3v5h5"/></svg></button></div></div>
        </section>
        <aside aria-label="Colors and drafts">
          <section class="card colors-card">
            <div class="section-heading"><h2>Colors</h2></div>
            <div class="recent-colors"><span id="recent-label" class="recent-label">Recently used</span><div id="recent-list" class="recent-list" role="group" aria-labelledby="recent-label"></div><p id="recent-empty" class="recent-empty">No recent colors.</p></div>
            <details class="color-section" data-section="wheel" open>
              <summary>Color wheel</summary>
              <div id="color-wheel" class="color-wheel">
                <canvas id="hue-ring" tabindex="0" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"></canvas>
                <canvas id="sv-square" tabindex="0" role="slider" aria-label="Saturation and brightness. Left and right change saturation, up and down change brightness." aria-valuetext=""></canvas>
                <span id="hue-marker" class="picker-marker" aria-hidden="true"></span>
                <span id="sv-marker" class="picker-marker" aria-hidden="true"></span>
              </div>
              <details class="color-section advanced-section" data-section="advanced">
                <summary>Advanced</summary>
                <div id="channel-list" class="channel-list"></div>
                <div class="hex-row"><label for="hex-input">Hex</label><input id="hex-input" type="text" maxlength="7" spellcheck="false" autocomplete="off" /></div>
              </details>
            </details>
            <details class="color-section" data-section="swatches">
              <summary>Swatches <span id="color-count"></span></summary>
              <div id="palette" aria-label="Color palette"></div>
            </details>
          </section>
        <details class="card drafts-column">
          <summary id="drafts-heading">Drafts</summary>
          <button id="save-draft" class="primary" type="button">Save draft</button>
          <ul id="draft-list" class="draft-list" aria-label="Saved drafts, newest first"></ul>
          <p id="drafts-empty" class="drafts-empty">No saved drafts.</p>
        </details>
        </aside>
      </div>
      <footer class="page-footer"><span id="save-status" role="status">Saved locally in this browser.</span></footer>
    </main>
    <dialog id="load-dialog" class="draft-dialog" aria-labelledby="load-dialog-title">
      <form method="dialog">
        <p id="load-dialog-title">Load this draft? It will replace the current canvas.</p>
        <div class="dialog-buttons"><button value="cancel">Cancel</button><button value="load" class="primary" autofocus>Load</button></div>
      </form>
    </dialog>
    <dialog id="unsaved-dialog" class="draft-dialog" aria-labelledby="unsaved-dialog-title">
      <form method="dialog">
        <p id="unsaved-dialog-title">Your current canvas is not saved.</p>
        <div class="dialog-buttons"><button value="cancel">Cancel</button><button value="discard">Load without saving</button><button value="save" class="primary" autofocus>Save, then load</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/pixelEditor.js"></script>
  </body>
</html>
